{% extends "base.html" %}

{% block title %}MediaArt UI{% endblock %}

{% block content %}

<section class="ma-section">

    <div class="container">

        <h1>MediaArt UI Kit</h1>

        <br>

        <a class="ma-btn ma-btn-primary">Primary</a>

        <a class="ma-btn ma-btn-secondary">Secondary</a>

        <a class="ma-btn ma-btn-outline">Outline</a>

        <br><br><br>

        <div class="ma-card-grid">

            <article class="ma-card ma-card-interactive">

                <div class="ma-card-media">
                    <img src="https://picsum.photos/600/400" alt="">
                </div>

                <div class="ma-card-body">

                    <h3 class="ma-card-title">
                        Demo Card
                    </h3>

                    <p class="ma-card-text ma-line-clamp-3">
                        This is the new MediaArt card system that will be reused across the whole project.
                    </p>

                    <div class="ma-card-footer">

                        <span>¥15,000</span>

                        <a class="ma-btn ma-btn-primary">
                            View
                        </a>

                    </div>

                </div>

            </article>

        </div>

    </div>

</section>

{% endblock %}
