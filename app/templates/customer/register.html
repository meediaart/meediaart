{% extends "base.html" %}

{% block title %}إنشاء حساب{% endblock %}

{% block content %}
<section class="shop-section customer-auth-page">
    <div class="container">
        <div class="customer-auth-card">
            <h1 class="section-title">إنشاء حساب</h1>

            <form method="POST" class="customer-auth-form">
                <div class="customer-form-group">
                    <label for="customerRegisterUsername">اسم المستخدم</label>

                    <input
                        type="text"
                        id="customerRegisterUsername"
                        name="username"
                        class="form-control"
                        placeholder="اسم المستخدم"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="customer-form-group">
                    <label for="customerRegisterEmail">البريد الإلكتروني</label>

                    <input
                        type="email"
                        id="customerRegisterEmail"
                        name="email"
                        class="form-control"
                        placeholder="البريد الإلكتروني"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="customer-form-group">
                    <label for="customerRegisterPassword">كلمة المرور</label>

                    <input
                        type="password"
                        id="customerRegisterPassword"
                        name="password"
                        class="form-control"
                        placeholder="كلمة المرور"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" class="btn-primary customer-auth-submit">
                    تسجيل
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
