<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <title>{{ subject }}</title>
</head>

<body style="margin:0;padding:0;background:#f4f4f4;font-family:Arial,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:40px 0;">
<tr>
<td align="center">

<table width="600" cellpadding="0" cellspacing="0"
       style="background:#ffffff;border-radius:16px;overflow:hidden;">

    <!-- Header -->
    <tr>
        <td align="center"
            style="background:#111827;padding:40px 20px;">

            <h1 style="color:#ffffff;margin:0;font-size:32px;">
                MEDIA ART
            </h1>

        </td>
    </tr>

    <!-- Content -->
    <tr>
        <td style="padding:40px;">

            <h2 style="margin-top:0;color:#111827;">
                {{ title }}
            </h2>

            <p style="font-size:16px;line-height:1.8;color:#444;">
                {{ message }}
            </p>

            <div style="margin:30px 0;padding:20px;background:#f9fafb;border-radius:12px;">
                <strong>
                    {{ order_label }}
                </strong>

                <div style="font-size:28px;margin-top:10px;color:#111827;">
                    #{{ order.id }}
                </div>
            </div>

            <div style="text-align:center;margin:40px 0;">

                <a href="{{ tracking_url }}"
                   style="
                   background:#111827;
                   color:#ffffff;
                   text-decoration:none;
                   padding:16px 30px;
                   border-radius:10px;
                   display:inline-block;
                   font-size:16px;
                   font-weight:bold;
                   ">
                    {{ track_button }}
                </a>

            </div>

            <p style="font-size:14px;color:#777;line-height:1.8;">
                {{ footer_text }}
            </p>

        </td>
    </tr>

    <!-- Footer -->
    <tr>
        <td align="center"
            style="background:#f3f4f6;padding:25px;font-size:13px;color:#666;">

            © {{ year }} MEDIA ART

        </td>
    </tr>

</table>

</td>
</tr>
</table>

</body>
</html>
